$kind: http-request
name: 'Create Memory - Missing Category (400)'
order: 2000
url: '{{baseUrl}}/api/v1/memory-vault'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "No category"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "category"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('category');
      });
