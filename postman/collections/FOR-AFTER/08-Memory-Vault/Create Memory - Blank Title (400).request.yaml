$kind: http-request
name: 'Create Memory - Blank Title (400)'
order: 4000
url: '{{baseUrl}}/api/v1/memory-vault'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "   ",
      "category": "FAMILY"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
