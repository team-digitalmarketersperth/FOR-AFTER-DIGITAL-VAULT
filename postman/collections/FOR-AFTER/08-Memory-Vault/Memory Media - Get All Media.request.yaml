$kind: http-request
name: 'Memory Media - Get All Media'
order: 13000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
