$kind: http-request
name: 'Memory Media - Get Upload URL'
order: 11000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media/upload-url'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "kind": "PHOTO",
      "originalFileName": "sofia-birthday.jpg",
      "mimeType": "image/jpeg",
      "sizeBytes": 1048576
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.collectionVariables.set('memoryMediaAssetId', json.mediaAssetId);
      pm.collectionVariables.set('memoryUploadUrl', json.uploadUrl);
