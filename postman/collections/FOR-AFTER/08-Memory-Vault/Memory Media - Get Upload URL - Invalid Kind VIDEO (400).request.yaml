$kind: http-request
name: 'Memory Media - Get Upload URL - Invalid Kind VIDEO (400)'
order: 12000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media/upload-url'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "kind": "VIDEO",
      "originalFileName": "sofia-birthday.jpg",
      "mimeType": "video/mp4",
      "sizeBytes": 1048576
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
