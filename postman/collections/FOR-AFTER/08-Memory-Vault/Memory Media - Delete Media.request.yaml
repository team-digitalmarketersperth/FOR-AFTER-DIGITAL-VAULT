$kind: http-request
name: 'Memory Media - Delete Media'
order: 18000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media/{{memoryMediaAssetId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
