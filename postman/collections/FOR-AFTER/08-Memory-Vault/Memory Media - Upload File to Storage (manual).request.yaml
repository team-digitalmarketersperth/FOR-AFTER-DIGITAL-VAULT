$kind: http-request
name: 'Memory Media - Upload File to Storage (manual)'
description: |-
  Optional. PUTs the file straight to Backblaze B2 using the presigned {{memoryUploadUrl}}.
  Before sending: Body > binary > choose a JPEG whose size is exactly the sizeBytes sent in Get Upload URL (1048576),
  or edit sizeBytes to match your file. Without this step, Complete Upload returns 409.
order: 15000
url: '{{memoryUploadUrl}}'
method: PUT
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'image/jpeg'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
