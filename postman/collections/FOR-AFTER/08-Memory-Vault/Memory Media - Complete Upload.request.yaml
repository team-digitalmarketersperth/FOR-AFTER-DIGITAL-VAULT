$kind: http-request
name: 'Memory Media - Complete Upload'
description: |-
  Passes only after the manual storage upload succeeded.
order: 16000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media/{{memoryMediaAssetId}}/complete'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
