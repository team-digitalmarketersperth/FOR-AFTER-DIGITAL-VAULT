$kind: http-request
name: 'Create Memory'
order: 1000
url: '{{baseUrl}}/api/v1/memory-vault'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "Our trip to Goa",
      "category": "TRAVEL",
      "textContent": "The whole family on the beach at sunset."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('memoryVaultItemId', json.id);
