$kind: http-request
name: 'Memory Media - Complete Before Upload (409)'
order: 14000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}/media/{{memoryMediaAssetId}}/complete'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
