$kind: http-request
name: 'Get Memories by Category'
order: 6000
url: '{{baseUrl}}/api/v1/memory-vault?category=TRAVEL'
method: GET
queryParams:
  - key: 'category'
    value: 'TRAVEL'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Every item is TRAVEL', function () {
        pm.response.json().forEach((m) => pm.expect(m.category).to.eql('TRAVEL'));
      });
