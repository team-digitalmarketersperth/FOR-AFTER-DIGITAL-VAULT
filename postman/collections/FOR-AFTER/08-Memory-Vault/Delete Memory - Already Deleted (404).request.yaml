$kind: http-request
name: 'Delete Memory - Already Deleted (404)'
order: 20000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
