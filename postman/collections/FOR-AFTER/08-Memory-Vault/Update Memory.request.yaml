$kind: http-request
name: 'Update Memory'
order: 10000
url: '{{baseUrl}}/api/v1/memory-vault/{{memoryVaultItemId}}'
method: PATCH
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "category": "FAMILY",
      "textContent": "Family trip to Goa, December."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('category updated', function () {
        pm.expect(pm.response.json().category).to.eql('FAMILY');
      });
