$kind: http-request
name: 'Complete Upload - Before File Uploaded (409)'
order: 7000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/{{mediaAssetId}}/complete'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
