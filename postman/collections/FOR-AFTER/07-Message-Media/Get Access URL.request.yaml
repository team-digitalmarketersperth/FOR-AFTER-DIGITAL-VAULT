$kind: http-request
name: 'Get Access URL'
description: |-
  Temporary signed URL for a READY asset.
order: 11000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/{{mediaAssetId}}/access-url'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has url, expiresAt', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('url');
        pm.expect(json).to.have.property('expiresAt');
      });
