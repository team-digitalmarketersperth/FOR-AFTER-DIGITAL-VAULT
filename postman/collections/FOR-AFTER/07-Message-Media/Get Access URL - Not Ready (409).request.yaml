$kind: http-request
name: 'Get Access URL - Not Ready (409)'
order: 8000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/{{mediaAssetId}}/access-url'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
