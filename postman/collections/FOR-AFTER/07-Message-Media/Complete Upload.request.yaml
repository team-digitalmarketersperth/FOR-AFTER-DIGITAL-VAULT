$kind: http-request
name: 'Complete Upload'
description: |-
  Passes only after "Upload File to Storage (manual)" succeeded.
order: 10000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/{{mediaAssetId}}/complete'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('status is READY', function () {
        pm.expect(pm.response.json().status).to.eql('READY');
      });
