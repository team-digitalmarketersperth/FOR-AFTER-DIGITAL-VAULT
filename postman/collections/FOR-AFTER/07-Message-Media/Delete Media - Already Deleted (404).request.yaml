$kind: http-request
name: 'Delete Media - Already Deleted (404)'
order: 14000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/{{mediaAssetId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
