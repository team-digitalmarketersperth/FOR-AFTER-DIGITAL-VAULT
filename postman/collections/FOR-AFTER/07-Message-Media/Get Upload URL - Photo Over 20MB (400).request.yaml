$kind: http-request
name: 'Get Upload URL - Photo Over 20MB (400)'
order: 5000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/upload-url'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "kind": "PHOTO",
      "originalFileName": "sofia-birthday.jpg",
      "mimeType": "image/jpeg",
      "sizeBytes": 20971521
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
