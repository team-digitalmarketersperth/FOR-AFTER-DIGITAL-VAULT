$kind: http-request
name: 'Get Upload URL'
order: 1000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/media/upload-url'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "kind": "PHOTO",
      "originalFileName": "sofia-birthday.jpg",
      "mimeType": "image/jpeg",
      "sizeBytes": 1048576
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Response has mediaAssetId, uploadUrl, expiresAt, requiredHeaders', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('mediaAssetId');
        pm.expect(json).to.have.property('uploadUrl');
        pm.expect(json).to.have.property('expiresAt');
        pm.expect(json).to.have.property('requiredHeaders');
      });
      const json = pm.response.json();
      pm.collectionVariables.set('mediaAssetId', json.mediaAssetId);
      pm.collectionVariables.set('uploadUrl', json.uploadUrl);
