$kind: http-request
name: 'Get All Prompts'
order: 1000
url: '{{baseUrl}}/api/v1/my-story/prompts'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Prompts have key and question', function () {
        const first = pm.response.json()[0];
        pm.expect(first).to.have.property('key');
      });
