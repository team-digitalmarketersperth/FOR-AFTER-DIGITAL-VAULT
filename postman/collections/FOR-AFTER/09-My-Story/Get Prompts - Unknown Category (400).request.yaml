$kind: http-request
name: 'Get Prompts - Unknown Category (400)'
order: 3000
url: '{{baseUrl}}/api/v1/my-story/prompts?category=SPORTS'
method: GET
queryParams:
  - key: 'category'
    value: 'SPORTS'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
