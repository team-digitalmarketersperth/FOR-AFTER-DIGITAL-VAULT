$kind: http-request
name: 'Delete Response - Not Found (404)'
order: 14000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
