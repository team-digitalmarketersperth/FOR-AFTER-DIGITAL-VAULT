$kind: http-request
name: 'Update Response'
order: 10000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: PUT
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "textContent": "Playing in my grandmother's garden in Jaipur. (edited)"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Answer updated', function () {
        pm.expect(pm.response.json().textContent).to.include('(edited)');
      });
