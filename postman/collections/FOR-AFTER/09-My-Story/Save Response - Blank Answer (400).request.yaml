$kind: http-request
name: 'Save Response - Blank Answer (400)'
order: 7000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: PUT
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "textContent": "   "
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "blank"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('blank');
      });
