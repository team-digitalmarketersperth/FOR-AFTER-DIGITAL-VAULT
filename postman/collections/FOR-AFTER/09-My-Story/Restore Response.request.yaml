$kind: http-request
name: 'Restore Response'
description: |-
  Saving again after delete restores the answer.
order: 15000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: PUT
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "textContent": "Playing in my grandmother's garden in Jaipur."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
