$kind: http-request
name: 'Save Response'
description: |-
  Create, update or restore the answer (PUT is idempotent).
order: 9000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: PUT
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "textContent": "Playing in my grandmother's garden in Jaipur."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has textContent', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('textContent');
      });
