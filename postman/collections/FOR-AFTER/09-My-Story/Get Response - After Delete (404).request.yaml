$kind: http-request
name: 'Get Response - After Delete (404)'
order: 13000
url: '{{baseUrl}}/api/v1/my-story/prompts/{{storyPromptKey}}/response'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
