$kind: http-request
name: 'Users - Detail'
order: 35000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('counts only, no private content', function () {
        const j = pm.response.json();
        pm.expect(j.counts).to.have.all.keys('recipientCount', 'trustedContactCount', 'messageCount', 'releasedMessageCount', 'memoryVaultCount');
        pm.expect(JSON.stringify(j)).to.not.match(/passwordHash|textContent|privateNote/);
      });
