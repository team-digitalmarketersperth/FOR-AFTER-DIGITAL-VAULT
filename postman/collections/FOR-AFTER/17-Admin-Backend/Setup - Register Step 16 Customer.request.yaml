$kind: http-request
name: 'Setup - Register Step 16 Customer'
description: |-
  A fresh fictional Customer for the suspend/reactivate tests. Never point these requests at a real account.
order: 3000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{s16CustomerEmail}}",
      "password": "{{dvCustomerPassword}}",
      "firstName": "Step16",
      "lastName": "Customer"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('s16CustomerEmail', `s16.customer.${Date.now()}@example.test`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.collectionVariables.set('customerUserId', pm.response.json().id);
