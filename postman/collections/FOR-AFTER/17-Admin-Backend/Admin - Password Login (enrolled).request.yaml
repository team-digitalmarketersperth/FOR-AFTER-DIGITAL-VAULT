$kind: http-request
name: 'Admin - Password Login (enrolled)'
description: |-
  ADMIN / SUPER_ADMIN: the password only returns an MFA challenge. No session cookie is set until TOTP (or a recovery code) succeeds.
order: 20000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('MFA required, no session yet', function () {
        const j = pm.response.json();
        pm.expect(j.mfaRequired).to.eql(true);
        pm.expect(j.challengeId).to.match(/^[A-Za-z0-9_-]{43}$/);
        pm.expect(j).to.not.have.property('email');
        pm.collectionVariables.set('adminMfaChallengeId', j.challengeId);
        pm.collectionVariables.set('adminMfaSetupRequired', String(j.mfaSetupRequired));
      });
