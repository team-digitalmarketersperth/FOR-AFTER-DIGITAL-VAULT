$kind: http-request
name: 'NEG - Users - Suspend with status injection (400)'
order: 39000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}/suspend'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "x",
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
