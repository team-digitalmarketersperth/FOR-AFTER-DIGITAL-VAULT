$kind: http-request
name: 'NEG - Admin - TOTP Verify wrong code (401)'
description: |-
  Counts 1 of 5 attempts on this challenge. Generic message; nothing about the account.
order: 23000
url: '{{baseUrl}}/api/v1/admin-auth/totp/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{adminMfaChallengeId}}",
      "code": "000000"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
