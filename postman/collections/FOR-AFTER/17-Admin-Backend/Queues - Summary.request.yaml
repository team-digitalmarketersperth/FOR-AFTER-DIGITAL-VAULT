$kind: http-request
name: 'Queues - Summary'
order: 54000
url: '{{baseUrl}}/api/v1/admin/system/queues'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('allowlisted queues only', function () {
        pm.expect(pm.response.json().map((q) => q.name)).to.eql(['message-release', 'death-verification']);
      });
