$kind: http-request
name: 'NEG - Customer - Suspend self via admin API (403)'
order: 10000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}/suspend'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "Nope."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', function () {
        pm.response.to.have.status(403);
      });
