$kind: http-request
name: 'Setup - Logout (reset session)'
order: 2000
url: '{{baseUrl}}/api/v1/auth/logout'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
