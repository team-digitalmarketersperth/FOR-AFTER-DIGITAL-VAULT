$kind: http-request
name: 'Users - Suspend'
order: 41000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}/suspend'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "Administrative suspension (Postman Step 16)."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('SUSPENDED', function () {
        pm.expect(pm.response.json().status).to.eql('SUSPENDED');
      });
