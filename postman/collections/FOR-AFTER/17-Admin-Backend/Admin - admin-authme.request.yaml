$kind: http-request
name: 'Admin - /admin-auth/me'
order: 27000
url: '{{baseUrl}}/api/v1/admin-auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      const j = pm.response.json();
      pm.test('MFA state, no secrets', function () {
        pm.expect(j.mfaVerified).to.eql(true);
        pm.expect(j.mfaEnabled).to.eql(true);
        pm.expect(JSON.stringify(j)).to.not.match(/secret|recovery|passwordHash/i);
      });
      pm.collectionVariables.set('adminUserId', j.id);
