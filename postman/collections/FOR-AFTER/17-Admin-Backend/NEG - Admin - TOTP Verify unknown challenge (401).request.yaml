$kind: http-request
name: 'NEG - Admin - TOTP Verify unknown challenge (401)'
order: 24000
url: '{{baseUrl}}/api/v1/admin-auth/totp/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
      "code": "123456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
