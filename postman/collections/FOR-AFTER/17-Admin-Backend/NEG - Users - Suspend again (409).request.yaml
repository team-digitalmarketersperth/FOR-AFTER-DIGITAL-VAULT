$kind: http-request
name: 'NEG - Users - Suspend again (409)'
order: 42000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}/suspend'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "x"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
