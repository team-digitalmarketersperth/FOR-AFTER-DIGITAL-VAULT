$kind: http-request
name: 'NEG - Users - Reactivate PASSED (409)'
order: 47000
url: '{{baseUrl}}/api/v1/admin/users/{{dvPassedUserId}}/reactivate'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "Must never override a verified death."
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('dvPassedUserId')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
