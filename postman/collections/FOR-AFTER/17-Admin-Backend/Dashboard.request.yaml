$kind: http-request
name: 'Dashboard'
order: 28000
url: '{{baseUrl}}/api/v1/admin/dashboard'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('real aggregates only', function () {
        const j = pm.response.json();
        pm.expect(Object.keys(j).sort()).to.eql(['deathVerification', 'queues', 'users']);
        pm.expect(j.users.total).to.be.a('number');
      });
