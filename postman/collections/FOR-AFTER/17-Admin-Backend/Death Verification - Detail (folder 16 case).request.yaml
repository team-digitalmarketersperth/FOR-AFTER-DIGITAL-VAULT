$kind: http-request
name: 'Death Verification - Detail (folder 16 case)'
description: |-
  Skipped unless folder 16 ran. The view is written to the audit log (ADMIN_VIEWED_DEATH_CASE).
order: 61000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('dvCaseId')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
