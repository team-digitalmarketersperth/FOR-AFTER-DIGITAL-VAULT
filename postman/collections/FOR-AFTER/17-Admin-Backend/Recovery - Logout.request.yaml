$kind: http-request
name: 'Recovery - Logout'
order: 62000
url: '{{baseUrl}}/api/v1/auth/logout'
method: POST
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('adminRecoveryCode')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
