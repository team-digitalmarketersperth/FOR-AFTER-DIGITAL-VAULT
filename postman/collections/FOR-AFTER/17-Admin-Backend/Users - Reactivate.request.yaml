$kind: http-request
name: 'Users - Reactivate'
order: 44000
url: '{{baseUrl}}/api/v1/admin/users/{{customerUserId}}/reactivate'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reason": "Issue resolved."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('ACTIVE', function () {
        pm.expect(pm.response.json().status).to.eql('ACTIVE');
      });
