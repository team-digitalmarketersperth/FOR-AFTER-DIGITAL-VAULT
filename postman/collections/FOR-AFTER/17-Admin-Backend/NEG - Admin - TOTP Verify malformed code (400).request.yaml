$kind: http-request
name: 'NEG - Admin - TOTP Verify malformed code (400)'
order: 21000
url: '{{baseUrl}}/api/v1/admin-auth/totp/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{adminMfaChallengeId}}",
      "code": "12ab56"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
