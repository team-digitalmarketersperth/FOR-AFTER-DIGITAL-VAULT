$kind: http-request
name: 'Users - Search Step 16 Customer'
order: 30000
url: '{{baseUrl}}/api/v1/admin/users?search={{s16CustomerEmail}}'
method: GET
queryParams:
  - key: 'search'
    value: '{{s16CustomerEmail}}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('found by email', function () {
        pm.expect(pm.response.json().items[0].id).to.eql(pm.collectionVariables.get('customerUserId'));
      });
