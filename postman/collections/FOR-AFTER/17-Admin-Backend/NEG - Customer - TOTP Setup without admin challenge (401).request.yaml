$kind: http-request
name: 'NEG - Customer - TOTP Setup without admin challenge (401)'
order: 11000
url: '{{baseUrl}}/api/v1/admin-auth/totp/setup'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
