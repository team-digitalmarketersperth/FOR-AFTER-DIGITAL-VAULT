$kind: http-request
name: 'TC Verify OTP'
order: 13000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{tcChallengeId}}",
      "code": "{{tcOtpCode2}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
