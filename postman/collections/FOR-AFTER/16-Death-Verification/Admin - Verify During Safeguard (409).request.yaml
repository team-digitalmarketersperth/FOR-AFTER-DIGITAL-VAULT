$kind: http-request
name: 'Admin - Verify During Safeguard (409)'
order: 20000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "verifiedDeathAt": "{{verifiedDeathAt}}",
      "confirmVerification": true,
      "decisionNote": "Fictional Step 15 verification test."
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 30 days ago, with an explicit offset: the 7-day AFTER_DEATH message is then overdue.
      pm.collectionVariables.set('verifiedDeathAt', new Date(Date.now() - 30 * 86400000).toISOString().replace('Z', '+00:00'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('Error mentions "safeguard"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('safeguard');
      });
