$kind: http-request
name: 'Customer - Login After VERIFIED (403)'
description: |-
  Replaces the session cookie in Postman: later Customer/admin calls act as this account.
order: 36000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{dvCustomerEmail}}",
      "password": "{{dvCustomerPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 403', function () {
        pm.response.to.have.status(403);
      });
