$kind: http-request
name: 'Reject - Admin Reject - confirmRejection Missing (400) (Wait 65 s)'
description: |-
  Run at least 65 seconds after the report (DEATH_VERIFICATION_SAFEGUARD_SECONDS=60). The pre-request script waits for you in the Collection Runner.
order: 58000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCase3Id}}/reject'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "decisionNote": "x"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Give the 60 s safeguard time to end before this request.
      setTimeout(function () {}, 65000);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
