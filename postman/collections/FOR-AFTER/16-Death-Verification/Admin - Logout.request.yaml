$kind: http-request
name: 'Admin - Logout'
description: |-
  A failed login keeps the previous (admin) cookie, so log out explicitly before the Trusted Contact check.
order: 39000
url: '{{baseUrl}}/api/v1/auth/logout'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
