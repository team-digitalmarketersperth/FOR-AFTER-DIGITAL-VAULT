$kind: http-request
name: 'Customer - Status SAFEGUARD_ACTIVE'
description: |-
  The API terminal shows "[DEV ONLY] Death verification safety notice sent to d***@example.test for case ...".
order: 15000
url: '{{baseUrl}}/api/v1/death-verification/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is SAFEGUARD_ACTIVE', function () {
        pm.expect(pm.response.json().status).to.eql('SAFEGUARD_ACTIVE');
      });
      pm.test('can confirm alive, deadline shown', function () {
        const json = pm.response.json();
        pm.expect(json.canConfirmAlive).to.eql(true);
        pm.expect(json.safeguardEndsAt).to.be.a('string');
        pm.expect(Object.keys(json).sort()).to.eql(['canConfirmAlive', 'safeguardEndsAt', 'status']);
      });
