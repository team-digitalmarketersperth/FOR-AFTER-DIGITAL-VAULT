$kind: http-request
name: 'Alive - Status Still CANCELLED (Wait 65 s)'
description: |-
  The original safeguard deadline has passed: the stale safeguard job must not revive the case.
  Run at least 65 seconds after the report (DEATH_VERIFICATION_SAFEGUARD_SECONDS=60). The pre-request script waits for you in the Collection Runner.
order: 50000
url: '{{baseUrl}}/api/v1/death-verification/me'
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Give the 60 s safeguard time to end before this request.
      setTimeout(function () {}, 65000);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is CANCELLED', function () {
        pm.expect(pm.response.json().status).to.eql('CANCELLED');
      });
