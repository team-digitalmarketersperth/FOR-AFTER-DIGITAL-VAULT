$kind: http-request
name: 'Alive - Confirm Alive Again (409)'
order: 49000
url: '{{baseUrl}}/api/v1/death-verification/me/confirm-alive'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "confirmAlive": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
