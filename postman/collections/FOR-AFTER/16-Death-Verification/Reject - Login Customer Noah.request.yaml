$kind: http-request
name: 'Reject - Login Customer Noah'
description: |-
  Replaces the session cookie in Postman: later Customer/admin calls act as this account.
order: 52000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{dvCustomer3Email}}",
      "password": "{{dvCustomerPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
