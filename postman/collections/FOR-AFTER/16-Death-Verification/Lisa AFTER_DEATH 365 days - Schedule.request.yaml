$kind: http-request
name: 'Lisa AFTER_DEATH 365 days - Schedule'
order: 10000
url: '{{baseUrl}}/api/v1/messages/{{dvAfterFutureMessageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "AFTER_DEATH",
      "afterDeathDays": 365
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
