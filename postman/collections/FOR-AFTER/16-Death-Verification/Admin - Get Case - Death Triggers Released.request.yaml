$kind: http-request
name: 'Admin - Get Case - Death Triggers Released'
description: |-
  ON_DEATH and the overdue AFTER_DEATH are released by the message-release queue within seconds; the 365-day AFTER_DEATH stays SCHEDULED.
order: 35000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      setTimeout(function () {}, 5000);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('ON_DEATH + overdue AFTER_DEATH RELEASED, future AFTER_DEATH SCHEDULED', function () {
        const byId = {};
        pm.response.json().activations.forEach((a) => (byId[a.messageId] = a.messageStatus));
        pm.expect(byId[pm.collectionVariables.get('dvOnDeathMessageId')]).to.eql('RELEASED');
        pm.expect(byId[pm.collectionVariables.get('dvAfterOverdueMessageId')]).to.eql('RELEASED');
        pm.expect(byId[pm.collectionVariables.get('dvAfterFutureMessageId')]).to.eql('SCHEDULED');
      });
