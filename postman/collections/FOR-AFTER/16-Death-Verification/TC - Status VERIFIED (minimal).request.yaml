$kind: http-request
name: 'TC - Status VERIFIED (minimal)'
order: 37000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{dvTcId}}/death-verification'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is VERIFIED', function () {
        pm.expect(pm.response.json().status).to.eql('VERIFIED');
      });
      pm.test('no death time, admin or note', function () {
        pm.expect(Object.keys(pm.response.json()).sort()).to.eql(['openedAt', 'reportedByYou', 'status']);
      });
