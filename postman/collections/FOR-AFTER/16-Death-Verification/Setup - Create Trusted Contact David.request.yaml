$kind: http-request
name: 'Setup - Create Trusted Contact David'
order: 4000
url: '{{baseUrl}}/api/v1/trusted-contacts'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstName": "David",
      "relationship": "Friend",
      "email": "{{trustedContactEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('dvTcId', json.id);
