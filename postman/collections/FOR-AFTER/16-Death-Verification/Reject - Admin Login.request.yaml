$kind: http-request
name: 'Reject - Admin Login'
description: |-
  Replaces the session cookie in Postman: later Customer/admin calls act as this account.
order: 55000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Step 16: MFA challenge (no session yet)', function () {
        const j = pm.response.json();
        pm.expect(j.mfaRequired).to.eql(true);
        pm.collectionVariables.set('adminMfaChallengeId', j.challengeId);
      });
