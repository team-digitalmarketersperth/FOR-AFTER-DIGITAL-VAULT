$kind: http-request
name: 'Admin - Get Case READY_FOR_REVIEW (Wait 65 s)'
description: |-
  Run at least 65 seconds after the report (DEATH_VERIFICATION_SAFEGUARD_SECONDS=60). The pre-request script waits for you in the Collection Runner.
order: 25000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Give the 60 s safeguard time to end before this request.
      setTimeout(function () {}, 65000);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is READY_FOR_REVIEW', function () {
        pm.expect(pm.response.json().status).to.eql('READY_FOR_REVIEW');
      });
      pm.test('reports + audit visible to admin; nothing activated', function () {
        const json = pm.response.json();
        pm.expect(json.reportCount).to.eql(1);
        pm.expect(json.reports[0].note).to.eql('Fictional Step 15 report.');
        pm.expect(json.auditEvents.map((e) => e.eventType)).to.eql(['REPORT_RECEIVED', 'SAFETY_NOTICE_SENT', 'SAFEGUARD_STARTED', 'SAFEGUARD_ELAPSED']);
        pm.expect(json.activations).to.eql([]);
      });
