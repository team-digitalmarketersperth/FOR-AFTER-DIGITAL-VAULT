$kind: http-request
name: 'Reject - Admin Reject'
order: 59000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCase3Id}}/reject'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "confirmRejection": true,
      "decisionNote": "Unable to verify."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is REJECTED', function () {
        pm.expect(pm.response.json().status).to.eql('REJECTED');
      });
      pm.test('nothing activated', function () {
        pm.expect(pm.response.json().activations).to.eql([]);
      });
