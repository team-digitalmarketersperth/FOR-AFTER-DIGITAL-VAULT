$kind: http-request
name: 'Admin - Verify - confirmVerification false (400)'
order: 27000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "verifiedDeathAt": "{{verifiedDeathAt}}",
      "confirmVerification": false
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 30 days ago, with an explicit offset: the 7-day AFTER_DEATH message is then overdue.
      pm.collectionVariables.set('verifiedDeathAt', new Date(Date.now() - 30 * 86400000).toISOString().replace('Z', '+00:00'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
