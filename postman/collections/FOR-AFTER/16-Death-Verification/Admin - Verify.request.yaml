$kind: http-request
name: 'Admin - Verify'
description: |-
  verifiedDeathAt = 30 days ago (+00:00).
order: 33000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "verifiedDeathAt": "{{verifiedDeathAt}}",
      "confirmVerification": true,
      "decisionNote": "Fictional Step 15 verification test."
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 30 days ago, with an explicit offset: the 7-day AFTER_DEATH message is then overdue.
      pm.collectionVariables.set('verifiedDeathAt', new Date(Date.now() - 30 * 86400000).toISOString().replace('Z', '+00:00'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('case status is VERIFIED', function () {
        pm.expect(pm.response.json().status).to.eql('VERIFIED');
      });
      pm.test('activations: ON_DEATH + both AFTER_DEATH, FIXED_DATE never', function () {
        const acts = pm.response.json().activations;
        pm.expect(acts.map((a) => a.triggerType).sort()).to.eql(['AFTER_DEATH', 'AFTER_DEATH', 'ON_DEATH']);
      });
      pm.test('Customer account is now PASSED', function () {
        pm.expect(pm.response.json().accountHolder.accountStatus).to.eql('PASSED');
      });
