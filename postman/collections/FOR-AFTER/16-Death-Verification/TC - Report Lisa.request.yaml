$kind: http-request
name: 'TC - Report Lisa'
order: 14000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{dvTcId}}/death-reports'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reportedDateOfDeath": "2026-09-01",
      "note": "Fictional Step 15 report.",
      "confirmReport": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has caseId', function () {
        pm.expect(json).to.have.property('caseId');
      });
      pm.collectionVariables.set('dvCaseId', json.caseId);
