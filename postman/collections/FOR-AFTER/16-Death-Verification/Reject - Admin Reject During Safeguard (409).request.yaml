$kind: http-request
name: 'Reject - Admin Reject During Safeguard (409)'
order: 56000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCase3Id}}/reject'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "confirmRejection": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
