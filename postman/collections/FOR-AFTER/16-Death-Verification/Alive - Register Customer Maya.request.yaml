$kind: http-request
name: 'Alive - Register Customer Maya'
description: |-
  Never your real account: a VERIFIED case permanently blocks the customer from signing in.
order: 42000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{dvCustomer2Email}}",
      "password": "{{dvCustomerPassword}}",
      "firstName": "Maya",
      "lastName": "Test"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Fresh fictional customer each run: verification marks the account PASSED.
      pm.collectionVariables.set('dvCustomer2Email', 'dv.maya.' + Date.now() + '@example.test');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
