$kind: http-request
name: 'Admin - Verify - Future Death (400)'
order: 30000
url: '{{baseUrl}}/api/v1/admin/death-verifications/{{dvCaseId}}/verify'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "verifiedDeathAt": "2099-01-01T00:00:00+00:00",
      "confirmVerification": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
