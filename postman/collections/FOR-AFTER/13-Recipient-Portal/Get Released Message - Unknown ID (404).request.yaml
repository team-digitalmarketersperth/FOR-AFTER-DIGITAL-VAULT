$kind: http-request
name: 'Get Released Message - Unknown ID (404)'
order: 4000
url: '{{baseUrl}}/api/v1/recipient/messages/00000000-0000-4000-8000-000000000000'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
