$kind: http-request
name: 'Get Recipient Me - After Logout (401)'
order: 10000
url: '{{baseUrl}}/api/v1/recipient-auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
