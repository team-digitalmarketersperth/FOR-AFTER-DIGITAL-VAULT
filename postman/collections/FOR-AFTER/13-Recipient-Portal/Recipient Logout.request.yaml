$kind: http-request
name: 'Recipient Logout'
order: 9000
url: '{{baseUrl}}/api/v1/recipient-auth/logout'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
