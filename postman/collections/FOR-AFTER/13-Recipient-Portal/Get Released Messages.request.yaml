$kind: http-request
name: 'Get Released Messages'
order: 1000
url: '{{baseUrl}}/api/v1/recipient/messages'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Release message is listed', function () {
        const ids = pm.response.json().map((m) => m.id);
        pm.expect(ids).to.include(pm.collectionVariables.get('releaseMessageId'));
      });
