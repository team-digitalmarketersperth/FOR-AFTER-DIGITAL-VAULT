$kind: http-request
name: 'Get Draft Message - Not Released (404)'
description: |-
  messageId is a DRAFT for the same recipient: it must not be visible.
order: 5000
url: '{{baseUrl}}/api/v1/recipient/messages/{{messageId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
