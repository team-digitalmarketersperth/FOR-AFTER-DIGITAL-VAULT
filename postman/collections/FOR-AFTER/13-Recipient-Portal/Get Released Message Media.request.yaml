$kind: http-request
name: 'Get Released Message Media'
order: 6000
url: '{{baseUrl}}/api/v1/recipient/messages/{{releaseMessageId}}/media'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      const media = pm.response.json();
      if (media.length) pm.collectionVariables.set('portalMediaAssetId', media[0].id);
