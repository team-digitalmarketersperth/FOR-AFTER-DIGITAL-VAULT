$kind: http-request
name: 'Get Released Messages - Customer Session Only (401)'
description: |-
  The Customer cookie is still present but must not authorize Recipient routes.
order: 11000
url: '{{baseUrl}}/api/v1/recipient/messages'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
