$kind: http-request
name: 'Logout'
order: 10000
url: '{{baseUrl}}/api/v1/auth/logout'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('success is true', function () {
        pm.expect(pm.response.json().success).to.eql(true);
      });
