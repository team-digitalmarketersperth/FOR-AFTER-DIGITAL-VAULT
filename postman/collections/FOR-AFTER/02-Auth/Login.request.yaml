$kind: http-request
name: 'Login'
order: 8000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has id, email, role', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id');
        pm.expect(json).to.have.property('email');
        pm.expect(json).to.have.property('role');
      });
      pm.test('Session cookie for_after_session is set', function () {
        pm.expect(pm.cookies.has('for_after_session')).to.be.true;
      });
