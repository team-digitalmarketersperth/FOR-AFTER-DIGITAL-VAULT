$kind: http-request
name: 'Login - Wrong Password (401)'
order: 6000
url: '{{baseUrl}}/api/v1/auth/login'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "WrongPassword999!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
