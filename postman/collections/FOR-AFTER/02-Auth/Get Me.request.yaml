$kind: http-request
name: 'Get Me'
order: 9000
url: '{{baseUrl}}/api/v1/auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Me is the logged-in customer', function () {
        pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('customerEmail'));
      });
