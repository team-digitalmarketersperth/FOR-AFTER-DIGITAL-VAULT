$kind: http-request
description: Registers Jiya. Returns 409 if the account already exists, which is fine on re-runs.
order: 1000
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "email": "jiya@gmail.com",
      "password": "Jiya123456@2026",
      "firstName": "Jiya",
      "lastName": "Singh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Register returns 201 (new) or 409 (already registered)', function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 409]);
      });
      if (pm.response.code === 201) {
        pm.test('Response is a safe user (no password hash)', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json.email).to.eql(pm.collectionVariables.get('customerEmail'));
          pm.expect(json).to.not.have.property('passwordHash');
        });
      }
    language: text/javascript
