$kind: http-request
name: 'Register - Short Password (400)'
order: 3000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "short.pw@example.com",
      "password": "short",
      "firstName": "Test",
      "lastName": "User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "password"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('password');
      });
