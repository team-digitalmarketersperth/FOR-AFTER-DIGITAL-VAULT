$kind: http-request
name: 'Get Recipients - Not Logged In (401)'
order: 12000
url: '{{baseUrl}}/api/v1/recipients'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
