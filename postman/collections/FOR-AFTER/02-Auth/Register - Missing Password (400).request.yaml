$kind: http-request
name: 'Register - Missing Password (400)'
order: 4000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "no.pw@example.com",
      "firstName": "Test",
      "lastName": "User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
