$kind: http-request
name: 'Register - Role ADMIN in Body (400)'
order: 5000
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "admin.try@example.com",
      "password": "StrongPassword123!",
      "firstName": "Test",
      "lastName": "User",
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "role"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('role');
      });
