$kind: http-request
name: 'Get Recipient Me'
order: 9000
url: '{{baseUrl}}/api/v1/recipient-auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has authenticated, email', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('authenticated');
        pm.expect(json).to.have.property('email');
      });
