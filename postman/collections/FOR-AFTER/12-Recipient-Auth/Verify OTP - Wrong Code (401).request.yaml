$kind: http-request
name: 'Verify OTP - Wrong Code (401)'
description: |-
  Uses one of the 5 attempts on this challenge.
order: 6000
url: '{{baseUrl}}/api/v1/recipient-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{challengeId}}",
      "code": "{{wrongCode}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Any 6-digit code that differs from the real one
      const real = pm.collectionVariables.get('otpCode');
      pm.variables.set('wrongCode', real === '000000' ? '111111' : '000000');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
