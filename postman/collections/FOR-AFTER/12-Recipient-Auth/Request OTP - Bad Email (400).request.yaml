$kind: http-request
name: 'Request OTP - Bad Email (400)'
order: 2000
url: '{{baseUrl}}/api/v1/recipient-auth/request-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
