$kind: http-request
name: 'Verify OTP - Code Already Used (401)'
order: 8000
url: '{{baseUrl}}/api/v1/recipient-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{challengeId}}",
      "code": "{{otpCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
