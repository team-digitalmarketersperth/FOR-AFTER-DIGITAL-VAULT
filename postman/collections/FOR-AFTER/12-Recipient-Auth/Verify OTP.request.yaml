$kind: http-request
name: 'Verify OTP'
description: |-
  Set the collection variable otpCode to the 6-digit code from the API console first.
order: 7000
url: '{{baseUrl}}/api/v1/recipient-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{challengeId}}",
      "code": "{{otpCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('authenticated as recipient', function () {
        const json = pm.response.json();
        pm.expect(json.authenticated).to.eql(true);
        pm.expect(json.email).to.eql(pm.collectionVariables.get('recipientEmail').toLowerCase());
      });
      pm.test('Recipient cookie is set', function () {
        pm.expect(pm.cookies.has('for_after_recipient_session')).to.be.true;
      });
