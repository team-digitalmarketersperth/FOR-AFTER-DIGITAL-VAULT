$kind: http-request
name: 'Request OTP'
description: |-
  Always 202 with the same message, whether or not the email has access (no account enumeration).
order: 3000
url: '{{baseUrl}}/api/v1/recipient-auth/request-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{recipientEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 202', function () {
        pm.response.to.have.status(202);
      });
      const json = pm.response.json();
      pm.test('Response has challengeId', function () {
        pm.expect(json).to.have.property('challengeId');
      });
      pm.collectionVariables.set('challengeId', json.challengeId);
