$kind: http-request
name: 'Update Message - While Scheduled (409)'
order: 11000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}'
method: PATCH
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "Cannot edit"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
