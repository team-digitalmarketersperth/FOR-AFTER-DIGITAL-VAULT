$kind: http-request
name: 'Create Schedule - AFTER_DEATH Without Days (400)'
order: 7000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "AFTER_DEATH"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "afterDeathDays"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('afterDeathDays');
      });
