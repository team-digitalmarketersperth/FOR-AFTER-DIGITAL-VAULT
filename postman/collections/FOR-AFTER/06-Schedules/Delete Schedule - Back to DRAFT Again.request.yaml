$kind: http-request
name: 'Delete Schedule - Back to DRAFT Again'
order: 20000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
