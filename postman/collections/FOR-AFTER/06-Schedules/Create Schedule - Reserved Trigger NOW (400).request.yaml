$kind: http-request
name: 'Create Schedule - Reserved Trigger NOW (400)'
order: 3000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "NOW"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
