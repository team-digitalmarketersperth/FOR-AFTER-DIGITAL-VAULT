$kind: http-request
name: 'Create Schedule - Fixed Date No Timezone (400)'
order: 5000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "FIXED_DATE",
      "scheduledFor": "2030-12-25T09:00:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
