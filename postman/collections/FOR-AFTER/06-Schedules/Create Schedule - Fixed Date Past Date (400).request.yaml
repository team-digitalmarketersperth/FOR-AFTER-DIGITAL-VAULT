$kind: http-request
name: 'Create Schedule - Fixed Date Past Date (400)'
order: 4000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "FIXED_DATE",
      "scheduledFor": "2020-01-01T09:00:00Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "future"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('future');
      });
