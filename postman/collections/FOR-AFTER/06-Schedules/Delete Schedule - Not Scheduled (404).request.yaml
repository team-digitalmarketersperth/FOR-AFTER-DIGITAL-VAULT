$kind: http-request
name: 'Delete Schedule - Not Scheduled (404)'
order: 16000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
