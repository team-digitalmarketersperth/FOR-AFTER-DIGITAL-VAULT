$kind: http-request
name: 'Update Schedule - To AFTER_DEATH'
order: 13000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: PATCH
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "AFTER_DEATH",
      "afterDeathDays": 30
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('AFTER_DEATH with 30 days, no date', function () {
        const json = pm.response.json();
        pm.expect(json.triggerType).to.eql('AFTER_DEATH');
        pm.expect(json.afterDeathDays).to.eql(30);
        pm.expect(json.scheduledFor).to.eql(null);
      });
