$kind: http-request
name: 'Create Schedule - Missing Trigger Type (400)'
order: 2000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "scheduledFor": "2030-12-25T09:00:00+08:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "triggerType"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('triggerType');
      });
