$kind: http-request
name: 'Create Schedule - Duplicate Schedule (409)'
order: 12000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "FIXED_DATE",
      "scheduledFor": "{{scheduledFor}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // scheduledFor = now + 2592000s, ISO 8601 with Z offset
      pm.collectionVariables.set('scheduledFor', new Date(Date.now() + 2592000000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
