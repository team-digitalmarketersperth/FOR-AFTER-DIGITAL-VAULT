$kind: http-request
name: 'Create Schedule - Fixed Date'
order: 8000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "FIXED_DATE",
      "scheduledFor": "{{scheduledFor}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // scheduledFor = now + 2592000s, ISO 8601 with Z offset
      pm.collectionVariables.set('scheduledFor', new Date(Date.now() + 2592000000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Response has triggerType, scheduledFor', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('triggerType');
        pm.expect(json).to.have.property('scheduledFor');
      });
