$kind: http-request
name: 'Get Recipient - Deleted (404)'
order: 12000
url: '{{baseUrl}}/api/v1/recipients/{{tempRecipientId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
