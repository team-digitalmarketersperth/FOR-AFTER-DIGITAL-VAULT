$kind: http-request
name: 'Create Recipient - Bad Email (400)'
order: 4000
url: '{{baseUrl}}/api/v1/recipients'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstName": "Sofia",
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
