$kind: http-request
name: 'Create Recipient - Missing First Name (400)'
order: 3000
url: '{{baseUrl}}/api/v1/recipients'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "lastName": "Johnson"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "firstName"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('firstName');
      });
