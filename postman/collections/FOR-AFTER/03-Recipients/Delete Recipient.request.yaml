$kind: http-request
name: 'Delete Recipient'
order: 11000
url: '{{baseUrl}}/api/v1/recipients/{{tempRecipientId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
