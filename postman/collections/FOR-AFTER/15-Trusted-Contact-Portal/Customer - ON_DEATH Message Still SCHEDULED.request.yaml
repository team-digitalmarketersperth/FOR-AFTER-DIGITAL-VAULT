$kind: http-request
name: 'Customer - ON_DEATH Message Still SCHEDULED'
description: |-
  Uses the Customer cookie. The report released nothing.
order: 18000
url: '{{baseUrl}}/api/v1/messages/{{onDeathMessageId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('status is still SCHEDULED', function () {
        pm.expect(pm.response.json().status).to.eql('SCHEDULED');
      });
