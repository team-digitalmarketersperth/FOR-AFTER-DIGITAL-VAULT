$kind: http-request
name: 'Get Trusted Contact Me - After Logout (401)'
order: 22000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
