$kind: http-request
name: 'Report - Other Relationship ID (404)'
description: |-
  Sarah's relationship id: not David's, so 404 (never 403).
order: 3000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{otherTrustedContactId}}/death-reports'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reportedDateOfDeath": "2026-09-28",
      "note": "Fictional test report.",
      "confirmReport": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
