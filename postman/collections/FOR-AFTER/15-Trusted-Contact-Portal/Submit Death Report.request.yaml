$kind: http-request
name: 'Submit Death Report'
order: 14000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{reportTrustedContactId}}/death-reports'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reportedDateOfDeath": "2026-09-28",
      "note": "Fictional test report.",
      "confirmReport": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Pending verification, not verified', function () {
        const json = pm.response.json();
        pm.expect(json.status).to.eql('PENDING_VERIFICATION');
        pm.expect(json.message).to.eql('The report has been received and is pending verification.');
        pm.expect(json).to.have.property('caseId');
        pm.expect(json).to.have.property('reportId');
      });
