$kind: http-request
name: 'Get Case Status - Before Report'
order: 13000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{reportTrustedContactId}}/death-verification'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('No case yet (or pending from an earlier run)', function () {
        pm.expect(pm.response.json().status).to.be.oneOf([null, 'PENDING_VERIFICATION']);
      });
