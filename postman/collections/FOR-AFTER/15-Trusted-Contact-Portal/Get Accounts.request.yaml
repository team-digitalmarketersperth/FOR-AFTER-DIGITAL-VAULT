$kind: http-request
name: 'Get Accounts'
order: 1000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Customer relationship listed with safe fields only', function () {
        const account = pm.response.json().find((a) => a.trustedContactId === pm.collectionVariables.get('reportTrustedContactId'));
        pm.expect(account).to.be.an('object');
        pm.expect(Object.keys(account).sort()).to.eql(['accountHolder', 'deathVerificationStatus', 'hasPreservedContent', 'relationship', 'trustedContactId']);
        pm.expect(account.hasPreservedContent).to.be.a('boolean');
        pm.expect(JSON.stringify(account)).to.not.include(pm.collectionVariables.get('customerEmail'));
      });
