$kind: http-request
name: 'Customer - ON_DEATH Schedule Unchanged'
order: 19000
url: '{{baseUrl}}/api/v1/messages/{{onDeathMessageId}}/schedule'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('still ON_DEATH', function () {
        pm.expect(pm.response.json().triggerType).to.eql('ON_DEATH');
      });
