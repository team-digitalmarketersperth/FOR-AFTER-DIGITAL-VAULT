$kind: http-request
name: 'Submit Death Report - Duplicate (409)'
order: 15000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts/{{reportTrustedContactId}}/death-reports'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reportedDateOfDeath": "2026-09-28",
      "note": "Fictional test report.",
      "confirmReport": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
      pm.test('Error mentions "already been submitted"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('already been submitted');
      });
