$kind: http-request
name: 'Setup - Customer Creates ON_DEATH Message'
order: 3000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "For after I am gone",
      "textContent": "Fictional ON_DEATH message.",
      "recipientIds": ["{{recipientId}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('onDeathMessageId', json.id);
