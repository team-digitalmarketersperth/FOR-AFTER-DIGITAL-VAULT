$kind: http-request
name: 'Request OTP'
description: |-
  Code appears in the API terminal ([DEV ONLY] line). Copy it into tcOtpCode.
order: 10000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/request-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{trustedContactEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 202', function () {
        pm.response.to.have.status(202);
      });
      const json = pm.response.json();
      pm.test('Response has challengeId', function () {
        pm.expect(json).to.have.property('challengeId');
      });
      pm.collectionVariables.set('tcChallengeId', json.challengeId);
