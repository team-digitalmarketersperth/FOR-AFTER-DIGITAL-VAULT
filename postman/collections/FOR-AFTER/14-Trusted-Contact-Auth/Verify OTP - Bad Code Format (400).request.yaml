$kind: http-request
name: 'Verify OTP - Bad Code Format (400)'
order: 11000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{tcChallengeId}}",
      "code": "12ab"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
