$kind: http-request
name: 'Request OTP - Unknown DTO Field (400)'
order: 9000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/request-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{trustedContactEmail}}",
      "ownerUserId": "00000000-0000-4000-8000-000000000000"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
