$kind: http-request
name: 'Verify OTP'
description: |-
  Set tcOtpCode from the API terminal first.
order: 13000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{tcChallengeId}}",
      "code": "{{tcOtpCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('authenticated as trusted contact', function () {
        pm.expect(pm.response.json()).to.eql({ authenticated: true, email: pm.collectionVariables.get('trustedContactEmail') });
      });
      pm.test('Trusted Contact cookie is set', function () {
        pm.expect(pm.cookies.has('for_after_trusted_contact_session')).to.be.true;
      });
