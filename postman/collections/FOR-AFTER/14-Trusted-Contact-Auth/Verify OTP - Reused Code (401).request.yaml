$kind: http-request
name: 'Verify OTP - Reused Code (401)'
order: 14000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/verify-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "challengeId": "{{tcChallengeId}}",
      "code": "{{tcOtpCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
