$kind: http-request
name: 'Customer Session Only - Accounts (401)'
description: |-
  The Customer cookie never authorizes Trusted Contact routes.
order: 5000
url: '{{baseUrl}}/api/v1/trusted-contact/accounts'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', function () {
        pm.response.to.have.status(401);
      });
