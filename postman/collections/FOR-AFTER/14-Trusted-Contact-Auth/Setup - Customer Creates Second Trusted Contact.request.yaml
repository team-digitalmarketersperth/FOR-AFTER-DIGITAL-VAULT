$kind: http-request
name: 'Setup - Customer Creates Second Trusted Contact'
description: |-
  Used to prove David gets 404 for a relationship that is not his.
order: 2000
url: '{{baseUrl}}/api/v1/trusted-contacts'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstName": "Sarah",
      "relationship": "Sister",
      "email": "sarah.trusted@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('otherTrustedContactId', json.id);
