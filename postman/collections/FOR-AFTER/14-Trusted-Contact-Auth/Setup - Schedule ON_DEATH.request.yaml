$kind: http-request
name: 'Setup - Schedule ON_DEATH'
order: 4000
url: '{{baseUrl}}/api/v1/messages/{{onDeathMessageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "ON_DEATH"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
