$kind: http-request
name: 'Request OTP - Unknown Email (generic 202)'
description: |-
  Same 202 body as a real Trusted Contact: no enumeration.
order: 8000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/request-otp'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "unknown@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 202', function () {
        pm.response.to.have.status(202);
      });
      pm.test('Generic message', function () {
        pm.expect(pm.response.json().message).to.eql('If this email is registered as a trusted contact, a verification code has been sent.');
      });
