$kind: http-request
name: 'Get Trusted Contact Me'
order: 15000
url: '{{baseUrl}}/api/v1/trusted-contact-auth/me'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has authenticated, email', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('authenticated');
        pm.expect(json).to.have.property('email');
      });
