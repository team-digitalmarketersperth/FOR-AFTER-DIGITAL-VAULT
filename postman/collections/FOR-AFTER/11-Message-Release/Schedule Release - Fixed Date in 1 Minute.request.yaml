$kind: http-request
name: 'Schedule Release - Fixed Date in 1 Minute'
order: 3000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}/schedule'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "triggerType": "FIXED_DATE",
      "scheduledFor": "{{releaseAt}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // releaseAt = now + 60s, ISO 8601 with Z offset
      pm.collectionVariables.set('releaseAt', new Date(Date.now() + 60000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
