$kind: http-request
name: 'Delete Schedule - Released Message (409)'
order: 8000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}/schedule'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 409', function () {
        pm.response.to.have.status(409);
      });
