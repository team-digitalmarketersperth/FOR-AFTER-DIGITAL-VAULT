$kind: http-request
name: 'Get Release Message - SCHEDULED'
order: 4000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('status is SCHEDULED (or RELEASED if already due)', function () {
        pm.expect(pm.response.json().status).to.be.oneOf(['SCHEDULED', 'RELEASED']);
      });
