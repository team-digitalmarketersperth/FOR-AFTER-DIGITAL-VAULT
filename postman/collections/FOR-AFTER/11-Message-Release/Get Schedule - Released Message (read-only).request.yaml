$kind: http-request
name: 'Get Schedule - Released Message (read-only)'
description: |-
  A released schedule can still be read, but not changed or deleted.
order: 7000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}/schedule'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
