$kind: http-request
name: 'Create Release Message'
order: 1000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "For Sofia, when the time comes",
      "contentType": "TEXT",
      "textContent": "Sofia, I love you more than words can say.",
      "recipientIds": ["{{recipientId}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('releaseMessageId', json.id);
