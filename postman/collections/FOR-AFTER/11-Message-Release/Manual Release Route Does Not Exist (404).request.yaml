$kind: http-request
name: 'Manual Release Route Does Not Exist (404)'
order: 2000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}/release'
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
