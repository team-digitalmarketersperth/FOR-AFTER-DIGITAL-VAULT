$kind: http-request
name: 'Get Release Message - RELEASED'
description: |-
  Run about 60-90 seconds after scheduling.
order: 5000
url: '{{baseUrl}}/api/v1/messages/{{releaseMessageId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('status is RELEASED', function () {
        pm.expect(pm.response.json().status).to.eql('RELEASED');
      });
