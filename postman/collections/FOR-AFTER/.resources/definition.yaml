$kind: collection
name: FOR-AFTER API
description: |-
  For After backend API, Steps 1-16 (see docs/for-after-api-endpoints-step-1-to-13.md).

  Auth is cookie based, not Bearer tokens:
  - Customer routes use the for_after_session cookie set by POST /api/v1/auth/login.
  - Recipient routes use the for_after_recipient_session cookie set by POST /api/v1/recipient-auth/verify-otp.
  - Admin routes need MFA: /auth/login returns a challenge; /admin-auth/totp/verify creates the for_after_session (folder 17).
  Postman's cookie jar stores and resends them automatically for localhost.

  Run folders top to bottom; requests save ids into collection variables for later requests.
  Register and login are throttled to 5 requests per minute each; wait 60 s between full runs.
