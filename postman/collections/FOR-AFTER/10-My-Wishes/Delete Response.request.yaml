$kind: http-request
name: 'Delete Response'
order: 12000
url: '{{baseUrl}}/api/v1/my-wishes/prompts/{{wishPromptKey}}/response'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
