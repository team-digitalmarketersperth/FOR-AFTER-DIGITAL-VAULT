$kind: http-request
name: 'Get Prompt by Key'
order: 4000
url: '{{baseUrl}}/api/v1/my-wishes/prompts/{{wishPromptKey}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has key', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('key');
      });
