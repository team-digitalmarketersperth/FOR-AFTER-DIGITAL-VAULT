$kind: http-request
name: 'Get Prompts - Unknown Category (400)'
order: 3000
url: '{{baseUrl}}/api/v1/my-wishes/prompts?category=FOOD'
method: GET
queryParams:
  - key: 'category'
    value: 'FOOD'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
