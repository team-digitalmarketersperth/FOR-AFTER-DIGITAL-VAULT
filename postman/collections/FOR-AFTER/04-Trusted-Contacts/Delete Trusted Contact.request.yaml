$kind: http-request
name: 'Delete Trusted Contact'
order: 9000
url: '{{baseUrl}}/api/v1/trusted-contacts/{{trustedContactId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
