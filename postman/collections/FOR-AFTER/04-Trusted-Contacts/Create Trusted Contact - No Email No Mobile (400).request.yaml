$kind: http-request
name: 'Create Trusted Contact - No Email No Mobile (400)'
order: 2000
url: '{{baseUrl}}/api/v1/trusted-contacts'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstName": "Arjun"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "email or a mobile"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('email or a mobile');
      });
