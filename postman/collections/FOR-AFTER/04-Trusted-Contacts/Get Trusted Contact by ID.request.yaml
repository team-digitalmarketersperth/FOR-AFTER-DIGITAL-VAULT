$kind: http-request
name: 'Get Trusted Contact by ID'
order: 6000
url: '{{baseUrl}}/api/v1/trusted-contacts/{{trustedContactId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
