$kind: http-request
name: 'Delete Trusted Contact - Already Deleted (404)'
order: 10000
url: '{{baseUrl}}/api/v1/trusted-contacts/{{trustedContactId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
