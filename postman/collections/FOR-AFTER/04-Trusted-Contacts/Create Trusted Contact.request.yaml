$kind: http-request
name: 'Create Trusted Contact'
order: 1000
url: '{{baseUrl}}/api/v1/trusted-contacts'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "firstName": "Arjun",
      "lastName": "Singh",
      "relationship": "Brother",
      "email": "arjun.contact@example.com",
      "mobile": "+61400000002"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Response has id', function () {
        pm.expect(json).to.have.property('id');
      });
      pm.collectionVariables.set('trustedContactId', json.id);
