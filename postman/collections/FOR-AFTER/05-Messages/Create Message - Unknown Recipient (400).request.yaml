$kind: http-request
name: 'Create Message - Unknown Recipient (400)'
order: 7000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "Unknown recipient",
      "textContent": "Hello",
      "recipientIds": [
        "00000000-0000-4000-8000-000000000000"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "recipients are invalid"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('recipients are invalid');
      });
