$kind: http-request
name: 'Create Message - Missing Title (400)'
order: 3000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "textContent": "No title",
      "recipientIds": ["{{recipientId}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "title"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('title');
      });
