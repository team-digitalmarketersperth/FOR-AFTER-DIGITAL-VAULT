$kind: http-request
name: 'Delete Message'
order: 13000
url: '{{baseUrl}}/api/v1/messages/{{tempMessageId}}'
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', function () {
        pm.response.to.have.status(204);
      });
