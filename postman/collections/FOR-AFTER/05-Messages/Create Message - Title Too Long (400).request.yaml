$kind: http-request
name: 'Create Message - Title Too Long (400)'
order: 4000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "{{longTitle}}",
      "recipientIds": ["{{recipientId}}"]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set('longTitle', 'x'.repeat(201));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
