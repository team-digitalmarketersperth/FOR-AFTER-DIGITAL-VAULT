$kind: http-request
name: 'Create Message - Empty Recipients (400)'
order: 5000
url: '{{baseUrl}}/api/v1/messages'
method: POST
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "No recipients",
      "textContent": "Hello",
      "recipientIds": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Error mentions "recipientIds"', function () {
        pm.expect(JSON.stringify(pm.response.json())).to.include('recipientIds');
      });
