$kind: http-request
name: 'Update Message'
order: 12000
url: '{{baseUrl}}/api/v1/messages/{{messageId}}'
method: PATCH
auth:
  type: noauth
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "A birthday message for Sofia",
      "textContent": "Happy birthday my darling daughter. I am so proud of you."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('title updated', function () {
        pm.expect(pm.response.json().title).to.eql('A birthday message for Sofia');
      });
